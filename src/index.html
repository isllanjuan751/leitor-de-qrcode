<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <link rel="stylesheet" href="./index.css">
  <script src="./app.js" defer></script>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Leitor de QrCode</title>
</head>
<body>
  <header id="Cabecalho">
    <h1 id="Titulo">Leitor de QrCode</h1>
  </header>

  <div id="caixa">
    <div>
      <input type="text" id="Caminho" placeholder="Caminho do Qrcode">
    </div>

    <div>
      <button id="Scanner">Scannear e gerar resultado</button>
    </div>

    <div>
      <h3 id="result-title">Resultado</h3>
      <textarea id="resultado"></textarea>
    </div>
  </div>
</body>
</html>
